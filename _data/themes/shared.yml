# Tokens shared by every colour theme. Light and dark only differ on colour
# roles (see light.yml / dark.yml); fonts, motion, and geometry live here so
# a palette swap cannot drift the type stack.
#
# Consumed by theme-context.liquid → theme-vars-block.liquid / font-loader.

fonts:
  title: "Ancizar Serif"
  subtitle: "Ancizar Sans"
  label: "Marcellus SC"
  body: "Ancizar Sans"
  mono: "Courier Prime"
  code: "Courier Prime"
  cv_body: "Ancizar Sans"
  cv_body_weight: 400
  body_weight: 300
  body_weight_mobile: 350
  body_fallback: "sans-serif"
  subtitle_fallback: "sans-serif"
  title_fallback: "serif"
  label_fallback: "serif"
  google_title_spec: "ital,wght@0,400;0,600;1,400"
  google_subtitle_spec: "wght@300;350;400;600"
  google_label_spec: "wght@400;700"
  google_body_spec: "wght@300;350;400;600"
  google_mono_spec: "ital,wght@0,400;0,700;1,400;1,700"
  google_code_spec: "ital,wght@0,300;0,400;0,700;1,400;1,700"
  google_cv_body_spec: "wght@300;350;400;600"

motion:
  duration_fast: "0.15s"
  duration_base: "0.4s"
  duration_slow: "0.7s"
  ease_default: "ease"
  ease_out: "ease-out"

geometry:
  radius_card: "0"
