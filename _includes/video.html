{% if include.src %}
<figure class="article-video-landscape" style="margin: 1.5rem auto; text-align: center; max-width: 100%;">
  <video controls style="max-width: 100%; width: 100%; border-radius: 0;">
    <source src="{{ include.src }}" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  {% if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
{% endif %}
