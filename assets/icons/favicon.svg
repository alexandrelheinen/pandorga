<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Site">
  <title>Site</title>
  <style>
    /* Light plate: pastel triad on the dark frame. Dark plate: production triad
       on the light frame. The mark stays inside the maskable safe zone. */
    .primary { fill: #a4c8da; }
    .secondary { fill: #95c8a6; }
    .tertiary { fill: #ddd8a8; }
    .plate { fill: #5e5d59; }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #1c5a7a; }
      .secondary { fill: #287445; }
      .tertiary { fill: #746f30; }
      .plate { fill: #b8b7ae; }
    }
  </style>
  <rect class="plate" width="32" height="32"/>
  <g transform="translate(7.68 7.68) scale(0.52)">
    <polygon class="primary" points="0,0 23,0 15,17 0,20"/>
    <polygon class="secondary" points="23,0 32,0 32,32 17,21 15,17"/>
    <polygon class="tertiary" points="0,20 15,17 17,21 32,32 0,32"/>
  </g>
</svg>
