# Registry configuration schema for `pandorga:` in `_config.yml`.
# Source of truth for docs/configuration.md (PLT-AC-11).
# Validated at build time by PandorgaRegistry.validate! and related helpers.

identity:
  title: "`pandorga.identity`"
  keys:
    name:
      type: string
      required: true
      notes: Title suffix, default author, BibTeX. Also the legacy hero name when `first_name` or `last_name` is omitted
    first_name:
      type: string
      required: false
      notes: Hero given name and top-bar wordmark. Omitted or blank, the first word of `name` is used
    last_name:
      type: string
      required: false
      notes: Hero family name, kept whole (spaces allowed). Omitted or blank, the remainder of `name` is used
    short_name:
      type: string
      required: false
      notes: Shorter `<title>` suffix
    url:
      type: string
      required: false
      notes: Site canonical URL
    locale:
      type: string
      required: false
      notes: Default `en`

content:
  title: "`pandorga.content`"
  intro: |
    Legacy `content_api_base_url` still works as a fallback for `base_url`.
    When `backend` is omitted, a non-empty `base_url` or `content_api_base_url` selects `object_store`. With no origin, the default is `static`. An explicit `backend: static` still serves JSON from `_site` and clears the public URL at build time.
  keys:
    backend:
      type: "`static` \\| `r2` \\| `object_store` \\| `s3`"
      notes: "`static` serves JSON from `_site`. The others use `base_url` as the public object-store origin. Omitted plus a public URL selects `object_store`"
    base_url:
      type: string
      notes: Public content origin when backend is not `static`

home:
  title: "`pandorga.home`"
  keys:
    hero_art:
      type: string
      notes: Include path for hero decoration (default `page/hero-default.html`)

fonts:
  title: "`pandorga.fonts`"
  intro: |
    Each value is a Google Fonts family name, or a map with `family` plus optional `weights` (integers) and `italic` (boolean). An omitted role keeps the Architectural Ledger face. `code` follows `mono`, and the tagline and CV body follow `body`, when the theme used one family for both. Text faces still load after the first paint, with `display=swap`. A `_data/themes/shared.yml` file remains the fallback under any role this map does not set.
  keys:
    title:
      type: string or map
      notes: Display face. Default family `Cinzel Decorative`, weights 400, 700, and 900
    body:
      type: string or map
      notes: Reading face. Default family `Newsreader`, weights 300, 400, 500, 600, and 700
    mono:
      type: string or map
      notes: Monospace face. Default family `Courier Prime`, roman and italic at 400 and 700
    label:
      type: string or map
      notes: Optional chrome face. Default family `Marcellus SC`, weights 400 and 700
    subtitle:
      type: string or map
      notes: Optional tagline face. Omitted, it follows `body` when the theme used the same family

taxonomies:
  title: "`pandorga.taxonomies`"
  prose: |
    Closed tag vocabularies per collection (`tags`, `max`, `min`). Page-local
    `pandorga.pages[].taxonomy` is also accepted when a collection has no top-level
    entry.

pages:
  title: "`pandorga.pages[]`"
  footer: |
    Duplicate `key`, unknown `template`, or conflicting `path` fails the build.
  keys:
    key:
      type: string
      required: true
      notes: Unique page id
    template:
      type: string
      required: true
      notes: One of `cv`, `articles`, `blog`, `media`, `network`, `bibliography`, `portfolio`
    layout:
      type: string
      required: false
      notes: Jekyll layout override (default from template)
    collection:
      key_label: "collection` / `collections"
      type: string / map
      required: "template-dependent"
      notes: Content folders
    path:
      type: string
      required: true
      notes: Listing URL
    detail:
      type: string
      required: false
      notes: Detail route pattern
    nav:
      type: "map \\| `false`"
      required: false
      notes: "`{ group, icon }` or hide"
    home:
      type: "map \\| `false`"
      required: false
      notes: Home band options; omit for template defaults
    taxonomy:
      type: map
      required: false
      notes: Tag vocabulary for the page
    accent:
      type: string
      required: false
      notes: Page accent token
    language:
      type: string
      required: false
      notes: "Listing chrome + dates (`en` default). Use `pt-BR` for Portuguese UI (e.g. blog / rascunhos)"
  home_attributes:
    title: "`home` attributes"
    entries:
      - key: "`band: hero`"
        notes: Page feeds the hero (CV); not a separate band
      - key: "`band: index` + `group`"
        notes: Joins a shared index panel group
      - key: "`featured`"
        notes: Lead card for writing bands
      - key: "`limit`"
        notes: Max items in the band
      - key: "`cta`"
        notes: Listing CTA label (default `View all`)
      - key: "`false`"
        notes: Omit from the homepage
