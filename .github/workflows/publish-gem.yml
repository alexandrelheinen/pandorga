name: publish-gem

on:
  release:
    types: [published]

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"

      - name: Verify release tag matches Pandorga::VERSION
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(ruby -e 'require_relative "lib/pandorga/version"; print Pandorga::VERSION')"
          expected="v${version}"
          if [ "${tag}" != "${expected}" ]; then
            echo "::error::Release tag ${tag} does not match Pandorga::VERSION (${expected})"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and push gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "${GEM_HOST_API_KEY}" ]; then
            echo "::error::Missing repository secret RUBYGEMS_API_KEY"
            exit 1
          fi
          gem build pandorga.gemspec
          gem push "pandorga-${{ steps.version.outputs.version }}.gem"
