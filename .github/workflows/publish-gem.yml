name: publish-gem

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    # Must match the GitHub Environment name configured on RubyGems.org
    # (Trusted Publishing → Environment: release).
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"

      - name: Verify release tag matches Pandorga::VERSION
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(ruby -e 'require_relative "lib/pandorga/version"; print Pandorga::VERSION')"
          expected="v${version}"
          if [ "${tag}" != "${expected}" ]; then
            echo "::error::Release tag ${tag} does not match Pandorga::VERSION (${expected})"
            exit 1
          fi

      - uses: rubygems/release-gem@v1
