# Studio fragment for the portfolio (projects) template.
# Refs: PLT-AC-3, docs/spec.md §5.5
group: portfolio
group_label: Portfolio
needs_media: true
collection:
  label: Projects
  type: collection
  format: yaml-frontmatter
  filename: "{key}.md"
  operations:
    delete: false
  view:
    primary: project
    fields: [thumbnail, project, start_date, end_date, icon, key, status, sort_order]
    list_meta_fields: [status, start_date, end_date]
  fields:
    - name: layout
      label: Layout
      type: string
      hidden: true
      default: project
    - name: key
      label: Key
      type: string
      required: true
      description: "URL slug (/projects/key/) and citation handle."
    - name: title
      label: Title
      type: string
      required: true
    - name: project
      label: Project name
      type: string
      required: true
    - name: tagline
      label: Tagline
      type: text
    - name: start_date
      label: Start date
      type: string
    - name: end_date
      label: End date
      type: string
    - name: status
      label: Status
      type: select
      options:
        values: [ongoing, completed]
    - name: label
      label: Label
      type: string
      description: "Small caps line above the project name."
    - name: icon
      label: Icon
      type: string
      description: "Material Symbols name (e.g. memory, forest)."
    - name: tags
      label: Tags
      type: string
      list: true
      description: "Chips on the card; free text."
    - name: thumbnail
      label: Thumbnail
      type: image
      description: "HTTPS URL or /media/… path."
      options:
        media: images
        path: content/media/images/covers/projects
        rename: safe
    - name: external_url
      label: External URL
      type: string
    - name: article_url
      label: Article URL
      type: string
    - name: github
      label: GitHub URL
      type: string
    - name: sort_order
      label: Sort order
      type: number
      description: "Lowest first in the listing."
    - name: redirects
      label: Redirects
      type: string
      list: true
    - name: body
      component: markdown_body
