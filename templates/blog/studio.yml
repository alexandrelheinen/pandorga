# Studio fragment for the blog writing template.
# Refs: PLT-AC-3, docs/spec.md §5.5
group: writing
group_label: Writing
needs_media: true
collection:
  label: Posts
  type: collection
  format: yaml-frontmatter
  filename: "{year}-{month}-{day}-{key}.md"
  operations:
    delete: false
  view:
    primary: title
    fields: [thumbnail, title, date, published, language, key]
    list_meta_fields: [date, language]
  fields:
    - name: layout
      label: Layout
      type: string
      hidden: true
      default: post
    - name: key
      label: Key
      type: string
      required: true
      description: "URL slug and citation handle. Filename stem: YYYY-MM-DD-key.md."
    - name: title
      label: Title
      type: string
      required: true
    - name: date
      label: Date
      type: date
      required: true
      options:
        format: yyyy-MM-dd
        time: false
    - name: tags
      label: Tags
      type: select
      description: "Up to three. Empty is valid."
      options:
        multiple: true
        max: 3
        values: [Notes, Drafts, Ideas]
    - name: language
      label: Language
      type: select
      options:
        values: [enus, ptbr, frfr, eses]
    - name: thumbnail
      label: Thumbnail
      type: image
      description: "HTTPS URL or /media/… path."
      options:
        media: images
        path: content/media/images/covers/posts
        rename: safe
    - name: published
      label: Published
      type: boolean
      default: true
    - name: redirects
      label: Redirects
      type: string
      list: true
    - name: body
      component: markdown_body
