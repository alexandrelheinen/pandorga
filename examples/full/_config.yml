title: "Full Pandorga Example"
description: "All seven templates with a fictional persona."
theme: pandorga
plugins:
  - pandorga
  - jekyll-redirect-from

pandorga:
  identity:
    name: "Ada Example"
    first_name: "Ada"
    last_name: "Example"
    short_name: "A. Example"
    url: "https://example.org"
    locale: en
  content:
    backend: static
    base_url: ""
  home:
    hero_art: page/hero-default.html
  taxonomies:
    articles:
      tags: [Writing]
      max: 3
    posts:
      tags: [notes]
      max: 3
    projects:
      tags: [tools]
      max: 3
  pages:
    - key: cv
      template: cv
      title: Curriculum Vitæ
      path: /pages/cv/
      collections: { jobs: jobs, products: products }
      nav: { group: Profile, icon: article_person }
      home: { band: hero }
    - key: projects
      template: portfolio
      title: Projects
      collection: projects
      path: /pages/projects/
      detail: /projects/:slug/
      nav: { group: Profile, icon: terminal }
      home: { limit: 4 }
    - key: articles
      template: articles
      title: Articles
      collection: articles
      path: /pages/articles/
      detail: /articles/:slug/
      language: en
      accent: green
      nav: { group: Writing, icon: newsmode }
      home: { featured: true, limit: 3 }
    - key: blog
      template: blog
      title: Rascunhos
      collection: posts
      path: /pages/blog/
      detail: /posts/:slug/
      language: pt-BR
      accent: ochre
      nav: { group: Writing, icon: stylus_note }
      home: { limit: 4 }
    - key: resources
      template: media
      title: Sources
      collection: resources
      path: /pages/sources/
      nav: { group: References, icon: media_link }
      home: { band: index, group: references }
    - key: network
      template: network
      title: Network
      sources: [articles, blog]
      path: /pages/network/
      nav: { group: References, icon: flowchart }
      home: { band: index, group: references }
    - key: bibliography
      template: bibliography
      title: Bibliography
      collection: bibliography
      cited_by: [articles, blog]
      path: /pages/bibliography/
      nav: false
      home: { band: index, group: references }

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _content_json/
