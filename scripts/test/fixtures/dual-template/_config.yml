title: Dual Template Fixture
description: Two articles instances with different collections (PLT-AC-4).
# Minimal Jekyll source for generator unit tests — not a full example site.

pandorga:
  identity:
    name: Ada Example
    short_name: A. Example
    url: https://example.org
    locale: en
  content:
    backend: static
    base_url: ""
  pages:
    - key: articles-en
      template: articles
      title: Articles
      collection: articles
      path: /pages/articles/
      detail: /articles/:slug/
      language: en
      nav: { group: Writing, icon: newsmode }
      home: { featured: true, limit: 3 }
    - key: articles-notes
      template: articles
      title: Notes
      collection: notes
      path: /pages/notes/
      detail: /notes/:slug/
      language: en
      nav: { group: Writing, icon: edit_note }
      home: false
